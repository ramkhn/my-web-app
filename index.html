<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web App with Database</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-lg rounded-xl p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-slate-800 mb-4 text-center">My Web App</h1>
        <p class="text-slate-600 text-sm mb-6 text-center">Connected to a local database (localStorage)</p>

        <!-- Input Form -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="itemInput" placeholder="Enter a new item..." 
                class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="addBtn" 
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Add</button>
        </div>

        <!-- Data List -->
        <h2 class="text-lg font-semibold text-slate-700 mb-2">Stored Data:</h2>
        <ul id="itemList" class="space-y-2 max-h-60 overflow-y-auto">
            <!-- Items will be injected here by JavaScript -->
        </ul>
    </div>

    <!-- Link the Database and Script files -->
    <script src="database.js"></script>
    <script src="script.js"></script>
</body>
</html>
